name: CI — Live Verification of ghost-100 Against Canonical O(1) cas-v1

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-ghost-100:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run All 100 Catalog Validations & Live cas-v1 Hydrations
        run: node --test run-demos.mts
